<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quill 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="options-shell">
    <header class="options-header">
      <div>
        <p class="options-kicker">QUILL</p>
        <h1>Quill 设置</h1>
      </div>
      <span class="options-header-note">本地配置 · 不上传输入内容</span>
    </header>
    <div class="options-layout">
      <nav class="options-sider" aria-label="设置导航">
        <button type="button" class="options-nav-item is-active" data-section="model"><span aria-hidden="true">◇</span><span>模型</span></button>
      </nav>
      <main id="options-content" class="options-content"></main>
    </div>
  </div>

  <dialog id="model-dialog" class="dialog-panel">
    <form id="model-form" method="dialog">
      <div class="dialog-header"><h3 id="model-dialog-title">新增模型</h3><button type="button" class="icon-button dialog-close" aria-label="关闭" title="关闭">×</button></div>
      <p class="dialog-description">模型信息只保存在本机，不会上传或同步到任何服务器。</p>
      <div class="dialog-body form-stack">
        <label>模型名称<input id="model-name" type="text" maxlength="30" placeholder="例如：工作 Qwen" /><span id="model-name-count" class="char-count">0/30</span></label>
        <label>Base URL<input id="model-base-url" type="url" placeholder="https://api.example.com/v1" /></label>
        <label>API Key<input id="model-api-key" type="password" autocomplete="off" placeholder="API Key" /></label>
        <label>模型 ID<input id="model-id" type="text" placeholder="例如：qwen-plus" /></label>
        <p id="model-form-status" class="form-status" hidden></p>
      </div>
      <div class="dialog-footer">
        <button id="model-test" type="button" class="button secondary">测试连接</button>
        <button type="button" class="button ghost dialog-cancel">取消</button>
        <button id="model-save" type="submit" class="button primary">保存模型</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog-panel dialog-panel-sm">
    <div class="dialog-header"><h3 id="confirm-title">确认删除</h3><button type="button" class="icon-button dialog-close" aria-label="关闭" title="关闭">×</button></div>
    <p id="confirm-description" class="confirm-description"></p>
    <div class="dialog-footer">
      <button type="button" class="button ghost dialog-cancel">取消</button>
      <button id="confirm-action" type="button" class="button danger">删除</button>
    </div>
  </dialog>

  <script type="module" src="options.ts"></script>
</body>
</html>
