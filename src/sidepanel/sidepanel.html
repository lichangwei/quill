<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>嘴替动作编辑</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>✦ 嘴替</h1>
      <p>编辑页面动作</p>
    </div>
    <button type="button" class="page-chat-toggle" title="与页面对话" aria-label="与页面对话"><i data-lucide="messages-square"></i></button>
    <div class="disable-controls" hidden>
      <button type="button" class="disable-site" aria-label="切换此网站插件状态"><i data-lucide="ban"></i></button>
    </div>
    <button type="button" class="settings-button" title="设置" aria-label="设置">
      <i data-lucide="settings"></i>
    </button>
  </header>
  <main id="app" aria-live="polite">
    <p class="empty">正在加载...</p>
  </main>
  <script type="module" src="sidepanel.ts"></script>
</body>
</html>
